name: Build Android APK

on:
  push:
  # Permet aussi de lancer la compilation manuellement depuis l'onglet "Actions" de GitHub
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Java (néentaire pour Gradle/Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Donner les droits d'exécution au script gradle (gradlew)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Compiler l'APK en mode Debug
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 5. Sauvegarder l'APK généré pour pouvoir le télécharger depuis GitHub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
